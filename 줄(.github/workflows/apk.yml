{"name": "Build APK",
"on": ["push", "workflow_dispatch"],
"jobs": {"build": {"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "17"}},
{"name": "Get Gradle (several mirrors, with retries)", "run": "ok=0; for i in 1 2 3 4; do for u in https://services.gradle.org/distributions/gradle-8.14.3-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-bin.zip; do echo \"trying $u\"; if curl -fL --retry 2 --connect-timeout 20 -o $HOME/g.zip \"$u\" && unzip -tq $HOME/g.zip >/dev/null; then ok=1; break 2; fi; done; echo 'all failed, waiting 30s'; sleep 30; done; [ $ok = 1 ] || exit 1; unzip -q $HOME/g.zip -d $HOME/gr; echo $HOME/gr/gradle-8.14.3/bin >> $GITHUB_PATH"},
{"name": "Find and unpack project", "run": "if [ -f AshenCity/settings.gradle ]; then echo 'project folder already here'; else f=$(find . -iname '*ashencity*.zip' -not -path './.git/*' | head -1); [ -z \"$f\" ] && f=$(find . -iname '*.zip' -not -path './.git/*' | head -1); echo \"using: $f\"; [ -n \"$f\" ] || { echo 'NO ZIP FOUND'; exit 1; }; rm -rf AshenCity; unzip -q \"$f\"; fi; ls AshenCity"},
{"name": "Build", "working-directory": "AshenCity", "run": "gradle --version && gradle assembleDebug --no-daemon --stacktrace"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "ashen-city-apk", "path": "AshenCity/app/build/outputs/apk/debug/app-debug.apk"}}
]}}}
